date.timezone=UTC
display_errors=Off
log_errors=On

; Maximum amount of memory a script may consume (128MB)
; http://php.net/memory-limit
memory_limit = 256M
; Maximum allowed size for uploaded files. Keep in sync with the informativo
; FileUpload::maxSize(25600) in InformativosTable/InformativosRelationManager.
; http://php.net/upload-max-filesize
upload_max_filesize = 25M
; Sets max size of the WHOLE request body, not per file — the "Adicionar
; informativos" modal submits several files in one request, so this has to
; cover a full batch (up to ~10 files at 25M each), not just one upload_max_filesize.
; http://php.net/post-max-size
post_max_size = 300M
max_execution_time=600
default_socket_timeout=3600
request_terminate_timeout=600
