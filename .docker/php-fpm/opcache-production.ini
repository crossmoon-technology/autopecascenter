; Production overrides for .docker/php-fpm/opcache.ini.
; validate_timestamps=0 stops PHP from checking file mtimes on every request — a real perf win,
; but it also means code changes are NOT picked up until php-fpm is restarted/reloaded.
; Restart after every deploy: docker compose -f docker-compose.prod.yml restart php-fpm

opcache.enable=1
opcache.memory_consumption=256
opcache.use_cwd=0
opcache.max_file_size=0
opcache.max_accelerated_files=30000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
