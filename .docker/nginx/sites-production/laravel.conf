# Production vhost for autopecascenter.com.br.
# Certificates are NOT managed by this container — drop the files the hosting/CA gave you at
# .docker/nginx/ssl/production/autopecascenter.com.br.crt and .docker/nginx/ssl/production/autopecascenter.com.br.key
# (that directory is gitignored, same as the dev self-signed one).

server {
    listen 80;
    listen [::]:80;
    server_name autopecascenter.com.br www.autopecascenter.com.br;

    # Keep this open in case you ever add Certbot/ACME renewal later.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }

    location / {
        return 301 https://autopecascenter.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.autopecascenter.com.br;
    ssl_certificate /etc/nginx/ssl/production/autopecascenter.com.br.crt;
    ssl_certificate_key /etc/nginx/ssl/production/autopecascenter.com.br.key;

    return 301 https://autopecascenter.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/production/autopecascenter.com.br.crt;
    ssl_certificate_key /etc/nginx/ssl/production/autopecascenter.com.br.key;

    server_name autopecascenter.com.br;
    root /var/www/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Pragma "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=(), usb=(), fullscreen=()" always;

    # Built frontend assets (npm run build) are content-hashed by Vite — cache aggressively.
    location /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }

    error_log /var/log/nginx/production_error.log;
    access_log /var/log/nginx/production_access.log;
}
